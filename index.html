<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b5d3b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Coach O23">
  <title>Football Coach</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=2.11.0">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">FS</div>
        <div><strong id="brandTeam">Full Speed O23</strong><span>Football Coach</span></div>
      </div>
      <nav class="side-nav" aria-label="Hoofdnavigatie">
        <button class="nav-item active" data-page="dashboard" aria-current="page">⌂ <span>Vandaag</span></button>
        <button class="nav-item" data-page="players">♙ <span>Teams & spelers</span></button>
        <button class="nav-item" data-page="attendance">✓ <span>Aanwezigheid</span></button>
        <button class="nav-item" data-page="trainings">◫ <span>Trainingen</span></button>
        <button class="nav-item" data-page="exercises">▦ <span>Oefeningen</span></button>
        <button class="nav-item" data-page="matches">⚽ <span>Wedstrijden</span></button>
        <button class="nav-item" data-page="tactics">↗ <span>Tactiekbord</span></button>
        <button class="nav-item" data-page="gamemodel">◈ <span>Spelmodel</span></button>
        <button class="nav-item" data-page="season">▣ <span>Seizoen</span></button>
        <button class="nav-item" data-page="stats">▥ <span>Statistieken</span></button>
        <button class="nav-item" data-page="notes">✎ <span>Coachnotities</span></button>
        <button class="nav-item" data-page="knowledge">▤ <span>Kennisbank</span></button>
        <button class="nav-item" data-page="documents">⌁ <span>Bronnen</span></button>
        <button class="nav-item" data-page="assistant">✦ <span>Coachassistent</span></button>
        <button class="nav-item" data-page="settings">⚙ <span>Instellingen</span></button>
      </nav>
      <div class="sidebar-foot"><span class="dot"></span><span id="saveStateLabel">Lokaal opgeslagen</span></div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div><p class="eyebrow" id="pageEyebrow">SEIZOEN 2026/2027</p><h1 id="pageTitle">Vandaag</h1></div>
        <div class="top-actions"><span id="connectionState" class="connection-state online">● Online</span><button class="icon-btn" data-global-search title="Zoeken" aria-label="Zoeken">⌕</button><button class="icon-btn" id="undoAction" data-undo-action title="Ongedaan maken" aria-label="Ongedaan maken" disabled>↶</button><select id="globalTeamSelect" class="team-select" aria-label="Actief team"></select><button class="icon-btn" id="quickAdd" title="Snel toevoegen" aria-label="Snel toevoegen">＋</button></div>
      </header>
      <section id="app" class="content"></section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Mobiele navigatie">
    <button class="active" data-page="dashboard" aria-current="page" aria-label="Vandaag"><span aria-hidden="true">⌂</span><small>Vandaag</small></button>
    <button data-page="players" aria-label="Team"><span aria-hidden="true">♙</span><small>Team</small></button>
    <button data-page="matches" aria-label="Wedstrijden"><span aria-hidden="true">⚽</span><small>Wedstrijden</small></button>
    <button data-page="stats" aria-label="Statistieken"><span aria-hidden="true">▥</span><small>Statistieken</small></button>
    <button data-page="more" aria-label="Meer"><span aria-hidden="true">•••</span><small>Meer</small></button>
  </nav>

  <dialog id="modal">
    <form method="dialog" class="modal-card">
      <div class="modal-head"><h2 id="modalTitle"></h2><button value="cancel" class="icon-btn" aria-label="Sluiten">×</button></div>
      <div id="modalBody"></div>
      <div class="modal-actions"><button value="cancel" class="btn ghost">Annuleren</button><button id="modalSave" value="default" class="btn primary">Opslaan</button></div>
    </form>
  </dialog>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <input id="knowledgeFile" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
  <input id="knowledgeFileBulk" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple hidden>
  <input id="kdFile" type="file" accept="application/json,.json" hidden>
  <input id="docFile" type="file" accept=".pdf,.docx,.xlsx,.xlsm,.xls,.txt,.md,.csv,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="kennis.js?v=3"></script>
  <script src="app.js?v=2.11.0"></script>
</body>
</html>
